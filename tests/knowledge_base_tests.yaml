- description: "[privacy] Skip-level manager asks about a direct report's report"
  metadata: { category: privacy, articles: [employee-data-privacy, manager-guide-pto-leave, pto-policy], release_note: managers_own_team, requirements: [R5] }
  vars:
    employee_id: E1103 # Willa Webb manages Rafael Mendes (E1020), who manages Aisha (E1021)
